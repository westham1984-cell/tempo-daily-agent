name: Create Tempo Wallet
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile name'
        required: true
        type: choice
        options: [daily, foxtrot, golf, hotel, india, juliet, kilo]

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install Tempo CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -fsSL https://tempo.xyz/install | bash

      - name: Install extensions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ~/.tempo/env
          tempo add wallet
          tempo add request

      - name: Step 1 — Wallet login (publish URL via issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ~/.tempo/env
          PROFILE="${{ github.event.inputs.profile }}"

          tempo wallet login > /tmp/login.log 2>&1 &
          LOGIN_PID=$!

          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[^[:space:]]+' /tmp/login.log | head -1)
            if [ -n "$URL" ]; then
              echo "WALLET AUTH URL: $URL"
              gh issue create \
                --title "STEP1-WALLET-AUTH-${PROFILE}-${{ github.run_id }}" \
                --body "**Step 1 — Click to login wallet:**%0A%0A$URL" \
                --repo westham1984-cell/tempo-daily-agent || true
              break
            fi
            sleep 1
          done

          wait $LOGIN_PID
          echo "=== login.log ===" && cat /tmp/login.log

      - name: Step 2 — Request key provisioning (publish URL via issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ~/.tempo/env
          PROFILE="${{ github.event.inputs.profile }}"

          tempo request -X POST \
            "https://coingecko.mpp.paywithlocus.com/coingecko/top-gainers-losers" \
            --json '{"vs_currency":"usd","duration":"24h","top_coins":"300"}' \
            -o /tmp/test-report.json > /tmp/request.log 2>&1 &
          REQ_PID=$!

          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://wallet\.tempo\.xyz/api/auth/cli\?code=[^[:space:]]+' /tmp/request.log | tail -1)
            if [ -n "$URL" ]; then
              echo "REQUEST PROVISIONING URL: $URL"
              gh issue create \
                --title "STEP2-REQUEST-AUTH-${PROFILE}-${{ github.run_id }}" \
                --body "**Step 2 — Click to authorize request key:**%0A%0A$URL" \
                --repo westham1984-cell/tempo-daily-agent || true
              break
            fi
            sleep 1
          done

          wait $REQ_PID
          echo "=== request.log ===" && cat /tmp/request.log
          echo "=== find new files ==="
          find /home/runner/.tempo /home/runner/.local/share/tempo -type f 2>/dev/null
          echo "=== store.json ==="
          cat /home/runner/.tempo/wallet/store.json 2>/dev/null || echo "NOT FOUND"

      - name: Show keys and upload artifact
        if: always()
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          echo "=========================================="
          echo "SECRET: TEMPO_KEYS_TOML (or ${PROFILE^^}_KEYS_TOML)"
          echo "=========================================="
          cat /home/runner/.tempo/wallet/store.json 2>/dev/null || echo "store.json NOT FOUND"
          echo "=========================================="
          mkdir -p /tmp/keys-export
          cp /home/runner/.tempo/wallet/store.json /tmp/keys-export/store.json 2>/dev/null || true

      - name: Upload keys as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keys-${{ github.event.inputs.profile }}-${{ github.run_id }}
          path: /tmp/keys-export/
          retention-days: 1
          include-hidden-files: true
