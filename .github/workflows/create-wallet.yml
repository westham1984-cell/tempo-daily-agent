name: Create Tempo Wallet
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile name'
        required: true
        type: choice
        options: [daily, foxtrot, golf, hotel, india, juliet, kilo]

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install Tempo CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -fsSL https://tempo.xyz/install | bash

      - name: Login — publish URL via issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ~/.tempo/env
          PROFILE="${{ github.event.inputs.profile }}"

          tempo wallet login > /tmp/login.log 2>&1 &
          LOGIN_PID=$!

          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[^[:space:]]+' /tmp/login.log | head -1)
            if [ -n "$URL" ]; then
              echo "AUTH URL: $URL"
              gh issue create \
                --title "WALLET-AUTH-${PROFILE}-${{ github.run_id }}" \
                --body "$URL" \
                --repo westham1984-cell/tempo-daily-agent || true
              break
            fi
            sleep 1
          done

          wait $LOGIN_PID
          echo "=== login.log ==="
          cat /tmp/login.log
          echo "=== find keys ==="
          find /home/runner -name "*.toml" 2>/dev/null || true
          find /home/runner -name "keys*" 2>/dev/null || true
          find /tmp -name "*.toml" 2>/dev/null || true
          echo "=== tempo dir ==="
          ls -la /home/runner/.tempo/ 2>/dev/null || true
          ls -la /home/runner/.tempo/wallet/ 2>/dev/null || true

      - name: Upload keys as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tempo-debug-${{ github.event.inputs.profile }}
          path: /home/runner/.tempo/
          retention-days: 1
