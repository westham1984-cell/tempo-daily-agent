name: Create Tempo Wallet
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile name'
        required: true
        type: choice
        options: [daily, foxtrot, golf, hotel, india, juliet, kilo]

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install Tempo CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -fsSL https://tempo.xyz/install | bash

      - name: Login — publish URL via issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ~/.tempo/env
          PROFILE="${{ github.event.inputs.profile }}"

          # snapshot before login
          find /home/runner -newer /home/runner/.tempo/bin/tempo -not -path "*/proc/*" 2>/dev/null | sort > /tmp/before.txt

          tempo wallet login > /tmp/login.log 2>&1 &
          LOGIN_PID=$!

          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[^[:space:]]+' /tmp/login.log | head -1)
            if [ -n "$URL" ]; then
              echo "AUTH URL: $URL"
              gh issue create \
                --title "WALLET-AUTH-${PROFILE}-${{ github.run_id }}" \
                --body "$URL" \
                --repo westham1984-cell/tempo-daily-agent || true
              break
            fi
            sleep 1
          done

          wait $LOGIN_PID || true
          echo "=== login.log ==="
          cat /tmp/login.log

          echo "=== new/modified files after login ==="
          find /home/runner -newer /tmp/before.txt -not -path "*/proc/*" 2>/dev/null | sort

          echo "=== tempo dir full ==="
          find /home/runner/.tempo -type f 2>/dev/null

          echo "=== tempo wallet commands ==="
          /home/runner/.tempo/bin/tempo wallet --help 2>&1 || true

      - name: Copy tempo dir for artifact
        if: always()
        run: |
          mkdir -p /tmp/tempo-export
          cp -rp /home/runner/.tempo /tmp/tempo-export/ 2>/dev/null || true
          ls -laR /tmp/tempo-export/

      - name: Upload keys as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tempo-debug-${{ github.event.inputs.profile }}-${{ github.run_id }}
          path: /tmp/tempo-export/
          retention-days: 1
          include-hidden-files: true
