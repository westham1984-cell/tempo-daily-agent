name: CoinGecko Daily - foxtrot
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  coingecko-report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Install Tempo CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -fsSL https://tempo.xyz/install | bash

      - name: Restore wallet keys
        env:
          TEMPO_KEYS_TOML: ${{ secrets.FOXTROT_KEYS_TOML }}
        run: |
          if [ -z "$TEMPO_KEYS_TOML" ]; then
            echo "::error::TEMPO_KEYS_TOML secret is empty"
            exit 1
          fi
          mkdir -p ~/.tempo/wallet
          printf '%s' "$TEMPO_KEYS_TOML" > ~/.tempo/wallet/store.json
          chmod 600 ~/.tempo/wallet/store.json

      - name: Install tempo extensions
        run: |
          ~/.tempo/bin/tempo add wallet
          ~/.tempo/bin/tempo add request 0.5.2

      - name: DEBUG wallet state
        run: |
          source ~/.tempo/env
          echo "PATH=$PATH"
          echo "--- ls ~/.tempo/wallet ---"; ls -la ~/.tempo/wallet
          echo "--- store.json size ---"; wc -c ~/.tempo/wallet/store.json
          echo "--- top-level json keys ---"; python3 -c "import json;d=json.load(open('$HOME/.tempo/wallet/store.json'));print(list(d.keys()));import sys;st=d.get('tempo-cli.store',{}).get('state',{});print('state keys:',list(st.keys()));print('accounts:',st.get('accounts'));print('active:',st.get('activeAccount'));print('nAccessKeys:',len(st.get('accessKeys',[])))" 2>&1 | sed -E 's/0x[0-9a-fA-F]{16,}/0x<hex>/g'
          echo "--- tempo wallet whoami ---"; tempo wallet whoami 2>&1 | sed -E 's/0x[0-9a-fA-F]{16,}/0x<hex>/g' | head -30 || true
          echo "--- tempo wallet keys ---"; tempo wallet keys 2>&1 | sed -E 's/0x[0-9a-fA-F]{16,}/0x<hex>/g' | head -30 || true

      - name: Fetch top gainers & losers
        env:
          SOCKS5_PROXY: ${{ secrets.FOXTROT_PROXY }}
        run: |
          source ~/.tempo/env
          sudo apt-get install -y proxychains4 -q 2>/dev/null
          PROXY="${SOCKS5_PROXY#socks5://}"
          PUSER="${PROXY%%:*}"
          REST="${PROXY#*:}"
          PPASS="${REST%%@*}"
          PHOSTPORT="${REST#*@}"
          PHOST="${PHOSTPORT%%:*}"
          PPORT="${PHOSTPORT##*:}"
          printf 'strict_chain\nproxy_dns\nquiet_mode\n[ProxyList]\nsocks5  %s  %s  %s  %s\n'             "$PHOST" "$PPORT" "$PUSER" "$PPASS" | sudo tee /etc/proxychains4.conf > /dev/null
          mkdir -p reports
          DATE=$(date +%F)
          for attempt in 1 2 3; do
              echo "Attempt $attempt/3..."
              if OUTPUT=$(TEMPO_MAX_SPEND=1.00 proxychains4 ~/.tempo/bin/tempo request -X POST                   "https://coingecko.mpp.paywithlocus.com/coingecko/top-gainers-losers"                   --json '{"vs_currency":"usd","duration":"24h","top_coins":"300"}'                   -o "reports/foxtrot-movers-${DATE}.json" 2>&1); then
                break
              fi
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -qE '"code":"E_PAYMENT"|"code":"E_USAGE"'; then
                MSG=$(echo "$OUTPUT" | grep -oP '(?<="message":")[^"]*' | head -1)
                echo "::error::$MSG"
                exit 1
              fi
              [ $attempt -lt 3 ] && sleep 30
          done
          [ -f "reports/foxtrot-movers-${DATE}.json" ]

      - name: Show summary
        run: |
          DATE=$(date +%F)
          echo "## FOXTROT TOP GAINERS (24h)" >> $GITHUB_STEP_SUMMARY
          echo "| Coin | Change | Price |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          jq -r '.data.top_gainers[:5][] | "| \(.symbol | ascii_upcase) | +\(.usd_24h_change | tostring | .[0:6])% | $\(.usd) |"'             "reports/foxtrot-movers-${DATE}.json" >> $GITHUB_STEP_SUMMARY || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: foxtrot-coingecko-${{ github.run_id }}
          path: reports/
          retention-days: 30
